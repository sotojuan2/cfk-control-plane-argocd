apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: demo-topic-1
  namespace: confluent-cp
spec:
  replicas: 3
  partitionCount: 4
  configs:
    message.timestamp.type: "LogAppendTime"
  kafkaRest:
    # cp/docker-compose.yml exposes Kafka REST on :8082 (rest-proxy service)
    endpoint: http://host.docker.internal:8082
